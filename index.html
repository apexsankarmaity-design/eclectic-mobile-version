
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Eclectic</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        background: #ffffff;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 30px 0;
    }

    img {
        display: block;
        width: 70%;
        max-width: 900px;
        height: auto;
        margin: 0 auto;
    }

    /* Mobile */
    @media screen and (max-width: 768px) {
        body {
            padding: 15px 0;
        }

        img {
            width: 92%;
            max-width: 430px;
            height: auto;
        }
    }
</style>
</head>

<body>

    <img src="mobile-version.png" alt="Website Preview">

</body>
</html>
